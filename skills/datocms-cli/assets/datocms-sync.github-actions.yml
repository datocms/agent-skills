name: DatoCMS Blueprint Sync

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: Space-separated destination profile ids
        required: true
      dry_run:
        description: Add --dry-run
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Run blueprint sync helper
        # Inputs reach the shell only via env: an input expression inside run: is script injection.
        shell: bash
        run: |
          read -ra PROFILE_IDS <<< "$PROFILES"
          EXTRA_ARGS=()
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA_ARGS+=(--dry-run)
          fi
          node scripts/datocms-sync-projects.mjs "${PROFILE_IDS[@]}" "${EXTRA_ARGS[@]}"
        env:
          PROFILES: ${{ inputs.profiles }}
          DRY_RUN: ${{ inputs.dry_run }}
          # One secret per destination profile id in `profiles` (the helper runs migrations:run --profile=<id>)
          DATOCMS_CLIENT_A_PROFILE_API_TOKEN: ${{ secrets.DATOCMS_CLIENT_A_PROFILE_API_TOKEN }}
          DATOCMS_CLIENT_B_PROFILE_API_TOKEN: ${{ secrets.DATOCMS_CLIENT_B_PROFILE_API_TOKEN }}
