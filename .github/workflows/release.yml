# Attaches one claude.ai upload zip per skill to every published release. The zips are not committed: plugin
# installs copy the whole repo, and users of Claude chat download them from the release instead.
name: Release zips

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: dev/scripts/build-zips.sh dist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.zip --clobber
